plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${project.findProperty('artifact_name') ?: mod_id}-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Source files contain UTF-8 comments (incl. Chinese); on CJK Windows javac otherwise
// defaults to GBK and reports unmappable-character errors while compiling.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'thunderbolt.mixinAudit', 'true'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'thunderbolt.mixinAudit', 'true'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'thunderbolt.mixinAudit', 'true'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods { "${mod_id}" { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
}

// Forge discovers Mixin configs from the mod manifest. Registering the config through
// MixinGradle's `config` method also adds an early `--mixin.config` launch argument; on
// ForgeGradle 6 userdev that argument is processed before exploded mod resources join the
// transforming classloader, so runClient/runServer cannot read the otherwise valid JSON.
// Keep the release-jar manifest explicit, while the source manifest covers exploded runs.
jar {
    archiveClassifier = 'slim'

    manifest {
        attributes 'MixinConfigs': "${mod_id}.mixins.json"
    }
    from('LICENSE') {
        into 'META-INF'
    }
    // The refmap is present once through processed resources (development runs) and
    // once through MixinGradle's release-jar wiring. They are the same generated file.
    filesMatching("${mod_id}.refmap.json") {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

tasks.named('jarJar', Jar) {
    archiveClassifier = ''

    from('LICENSE') {
        into 'META-INF'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    // Forge/MCP 工具链依赖（accesstransformers 等）通过项目仓库解析。
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

configurations {
    optionalModShapeArtifacts {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // MixinExtras (@WrapOperation/@Local) is built into NeoForge but NOT Forge — required explicitly.
    // mixinextras-forge is a jar-in-jar shell (classes live in META-INF/jars/MixinExtras-0.4.1.jar),
    // so javac cannot see the classes from the shell artifact. Compile against mixinextras-common
    // (plain jar with all classes), keep the forge shell on the runtime classpath.
    //
    // implementation(jarJar(...)) is the official ForgeGradle 6 idiom: the shell is put on the dev
    // runtime classpath AND embedded into META-INF/jarjar/ of the released jar, so players' modpacks
    // get the MixinExtras classes automatically. Without it every @WrapOperation/@Local injection
    // fails at load time with ClassNotFoundException.
    compileOnly "io.github.llamalad7:mixinextras-common:0.4.1"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.4.1"
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1,)")
    }

    // Mixin annotation processor — generates thunderbolt.refmap.json.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // AE2 is provided by the modpack in production, but ForgeGradle development runs still
    // need it on their runtime classpath so client/server smoke tests exercise the real mod.
    // `runtimeOnly` does not bundle AE2 into the published Thunderbolt jar.
    compileOnly "appeng:appliedenergistics2-forge:${ae2_version}"
    runtimeOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    // The ModMaven AE2 artifact has no transitive POM metadata, so its mandatory
    // GuideME dependency must be declared explicitly for development launches.
    runtimeOnly fg.deobf("org.appliedenergistics:guideme:${guideme_version}")

    // Applied Flux — CurseForge 1.20.1 file.
    compileOnly "curse.maven:applied-flux-965012:7651647"

    // Compile the optional accessor descriptor against AdvancedAE's real field type. Mixin
    // matches accessors by name and JVM descriptor, so Object would never match ElapsedTimeTracker.
    compileOnly fg.deobf("maven.modrinth:advancedae:${advancedae_version}")

    // Unit tests for the pure planner core (no Minecraft/AE2 needed).
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    optionalModShapeArtifacts "maven.modrinth:advancedae:${advancedae_version}"
    optionalModShapeArtifacts "maven.modrinth:neoecoae:${neoecoae_version}"
    optionalModShapeArtifacts "maven.modrinth:ae2-crafting-tree-refreshed:${ae2_crafting_tree_version}"
    optionalModShapeArtifacts "maven.modrinth:extendedae-plus:${extendedae_plus_version}"
}

// Tests that exercise SavedData/codecs need the same generated Minecraft/Forge classes as main.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

test {
    useJUnitPlatform()
    dependsOn 'prepareOptionalModShapeArtifacts'
    systemProperty 'thunderbolt.optionalModShapeDir',
            layout.buildDirectory.dir('optional-mod-shapes').get().asFile.absolutePath
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.register("referenceCapabilityTest", Test) {
    description = "Runs the planner capability reference kit and prints its auditable result rows."
    group = "verification"
    useJUnitPlatform()
    filter {
        includeTestsMatching "com.moakiee.thunderbolt.core.crafting.planner.reference.*"
    }
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

tasks.register('prepareOptionalModShapeArtifacts', Sync) {
    from configurations.optionalModShapeArtifacts
    into layout.buildDirectory.dir('optional-mod-shapes')
}

processResources {
    // MixinGradle puts the annotation-processor refmap under build/tmp and wires it
    // into jars, but ForgeGradle's exploded development mod only exposes classes and
    // processed resources. Copy it as a generated resource so dev runs remap vanilla
    // targets exactly like the published jar.
    dependsOn compileJava
    from(layout.buildDirectory.file("tmp/compileJava/${mod_id}.refmap.json"))

    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        ae2_version_range      : ae2_version_range,
        guideme_version_range  : guideme_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            // Publish the actual distributable: Forge-remapped and with MixinExtras jar-in-jar.
            // Publishing components.java leaks ForgeGradle's synthetic `_mapped_official`
            // dependencies and selects the non-jarJar artifact.
            artifact(tasks.named('jarJar')) {
                classifier = null
            }
        }
    }
    repositories {
        maven {
            url = project.projectDir.toPath().resolve("repo").toUri()
        }
    }
}

// The artifact-only publication intentionally has no Gradle module metadata: consumers already
// provide Minecraft, Forge and AE2, and must not inherit this workspace's mapped dev coordinates.
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

tasks.withType(PublishToMavenLocal).configureEach {
    dependsOn tasks.named('reobfJarJar')
}

if (plugins.hasPlugin('idea')) {
    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}
