# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
# Mixin's annotation processor is not compatible with the configuration cache.
org.gradle.configuration-cache=false
# Gradle build cache is disabled: cached compileJava outputs miss the Mixin AP generated
# refmap (MixinGradle writes it outside Gradle's output tracking), producing release jars
# without thunderbolt.refmap.json -> "Reference map could not be read" at game load.
org.gradle.caching=false

