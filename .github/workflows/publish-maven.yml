name: Publish Maven package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish Maven package to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve tag version
        shell: bash
        run: |
          VERSION="$(./gradlew --no-daemon -q printProjectVersion)"
          EXPECTED="${TAG#v}"
          test "$VERSION" = "$EXPECTED"
          echo "Publishing Thunderbolt Maven version $VERSION"

      # Release platform uploads are handled by release.yml. This workflow only
      # bootstraps or updates the dependency package used by AE2LT builds.
      - name: Build package
        run: ./gradlew --no-daemon clean build -x check --max-workers 1

      - name: Publish Maven package
        run: ./gradlew --no-daemon publishMavenJavaPublicationToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
